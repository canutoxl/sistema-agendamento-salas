<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agendamento de Salas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        html{
            font-size: 16px;
        }

        html, body{
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
        }

        .app{
            width: 100%;
            height: 100%;
            padding: 2rem;
        }

        .container{
            max-width: 100%;
        }

        .container-agendamentos .row .col{
            border: 1px solid #101010;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="container text-center container-agendamentos">
            <h1 class="text-center">Agendamentos</h1>
            <div class="row">
                <div class="col">ID</div>
                <div class="col">Solicitante</div>
                <div class="col">Bloco</div>
                <div class="col">Sala</div>
                <div class="col">Data</div>
                <div class="col">Turno</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/src/app.js" type="module"></script>
</body>

</html>
